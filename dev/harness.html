<!doctype html>
<!--
  Dev harness: the deck mounted against a fake host, in a plain browser.

      npm run harness

  NOT shipped. The release zip is manifest.json + index.js and is built by
  scripts/package.sh, which never looks here; nothing in src/ imports it.

  WHY IT EXISTS. The deck's hard parts are geometric — where the stylus lands,
  what the cue maths maps a screen point to, how the magnifier's transform
  composes — and none of that is answerable from jsdom, which has no layout, or
  from the app, where a plugin reload costs a Tauri rebuild. Here you can measure
  the rendered thing directly: every bug in the cue path so far was found by
  comparing a computed radius against a real getBoundingClientRect, and the
  numbers in those commit messages came from this page.

  Controls: skin, track count, index, position, playing, plus a STOP button.
  `?secs=N` forces every track's duration, for seeing how much of the record a
  given running time earns. `window.__deckRoot` is the shadow root and
  `window.__probe()` reports the headshell's position in record-radius units.
  Set `window.__overlay = true` to draw band boundaries and the geometry's
  expected stylus radius over the deck.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>vinyl deck harness</title>
    <style>
      :root {
        --bg-primary: #14161a;
        --bg-tertiary: #2a2e35;
        --text-primary: #e8eaed;
        --accent: #6aa9ff;
      }
      body {
        margin: 0;
        background: #0b0c0e;
        color: var(--text-primary);
        font: 13px system-ui, sans-serif;
        display: flex;
        gap: 24px;
        padding: 24px;
      }
      .slot {
        width: 520px;
        height: 520px;
        position: relative;
        background: var(--bg-primary);
        border-radius: 8px;
      }
      .panel { display: flex; flex-direction: column; gap: 10px; width: 300px; }
      .row { display: flex; gap: 8px; align-items: center; }
      label { width: 96px; opacity: .8; }
      input[type="range"] { flex: 1; }
      code { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="slot" id="slot"></div>
    <div class="panel">
      <div class="row"><label>skin</label>
        <select id="skin">
          <option value="sl1200">sl1200</option>
          <option value="studio">studio</option>
        </select>
      </div>
      <div class="row"><label>tracks</label><input id="n" type="number" value="6" min="0" max="60" /></div>
      <div class="row"><label>index</label><input id="idx" type="range" min="0" max="5" value="0" /><code id="idxv">0</code></div>
      <div class="row"><label>position</label><input id="pos" type="range" min="0" max="1" step="0.001" value="0" /><code id="posv">0%</code></div>
      <div class="row"><label>playing</label><input id="playing" type="checkbox" checked /></div>
      <div class="row"><button id="remount">remount</button><button id="stop">press STOP</button></div>
      <div class="row"><label>arm r</label><code id="armr">-</code></div>

      <hr style="width:100%;border:0;border-top:1px solid #2a2e35" />
      <div class="row"><label>sounds</label><input id="snd" type="checkbox" /><code id="sndstate">off</code></div>
      <div class="row"><label>level</label><input id="lvl" type="range" min="0" max="1" step="0.01" value="0.5" /><code id="lvlv">50%</code></div>
      <div id="voices" style="display:flex;flex-direction:column;gap:2px;font-size:12px"></div>
      <div class="row"><label>vel</label><code id="velv">1.00</code> <code id="needlev">down</code></div>
      <div class="row" style="flex-wrap:wrap">
        <button data-snd="drop">drop</button>
        <button data-snd="lift">lift</button>
        <button data-snd="transport">START/STOP</button>
        <button data-snd="speed">33/45</button>
        <button data-snd="detent">detent</button>
        <button data-snd="band">band tick</button>
        <button data-snd="runout">run-out</button>
      </div>

      <pre id="log" style="white-space:pre-wrap;font-size:11px;opacity:.7"></pre>
    </div>

    <script type="module">
      import { createVinylDeckVisualizer } from "/src/visualizer.ts";
      import { buildGeometry, layoutBands, positionToRadius } from "/src/geometry.ts";
      import { splitSides, sideAt } from "/src/sides.ts";
      import { createDeckSounds, DEFAULT_SOUND_SETTINGS, VOICES } from "/src/sounds.ts";
      import { registerDeckSounds, setDeckSoundSettings } from "/src/soundSettings.ts";

      const slot = document.getElementById("slot");
      let viz = null;
      let root = null;
      let raf = 0;

      const q = (id) => document.getElementById(id);
      const state = { playing: true, index: 0, posFrac: 0, n: 6, rate: 1 };

      function tracks(n) {
        // Durations vary so bands are visibly unequal. `?secs=` overrides them all,
        // for looking at how much of the record a given running time earns.
        const forced = Number(new URLSearchParams(location.search).get("secs")) || 0;
        return Array.from({ length: n }, (_, i) => ({
          title: `Track ${i + 1}`,
          artistName: "Artist",
          albumTitle: "Album",
          durationSecs: forced || 150 + ((i * 71) % 190),
          artUrl: null,
        }));
      }

      let queue = tracks(state.n);

      function mount() {
        if (viz) { try { viz.destroy(); } catch {} }
        slot.innerHTML = "";
        const holder = document.createElement("div");
        holder.style.cssText = "position:absolute;inset:0";
        slot.append(holder);
        root = holder.attachShadow({ mode: "open" });
        viz = createVinylDeckVisualizer(q("skin").value);
        viz.mount({
          root,
          size: { width: slot.clientWidth, height: slot.clientHeight },
          pixelRatio: window.devicePixelRatio || 1,
          placement: "fullscreen",
          reducedMotion: false,
          token: (n) => getComputedStyle(document.documentElement).getPropertyValue(n),
          useDesignSystem() {},
          onResize: () => () => {},
          onSkinChange: () => () => {},
          // Absent until the sounds checkbox has built a context, which is what
          // an older app looks like to the deck — so the silent path gets
          // exercised here every time the page loads.
          audio: deckAudio(),
          actions: {
            seek: (s) => log(`seek ${s.toFixed(1)}s`),
            playQueueIndex: (i) => { log(`playQueueIndex ${i}`); state.index = i; q("idx").value = i; },
            setPlaying: (p) => { log(`setPlaying ${p}`); state.playing = p; q("playing").checked = p; },
            // Applied, not just logged: the deck reads the speed back out of the
            // frame state, so a host that only logs leaves the 33/45 lamps and the
            // strobe drift permanently untestable.
            setRate: (r) => { state.rate = r; log(`setRate ${r.toFixed(3)}`); },
          },
        });
        window.__deckRoot = root;
      }

      function log(m) {
        const el = q("log");
        el.textContent = (m + "\n" + el.textContent).split("\n").slice(0, 12).join("\n");
      }

      let t0 = 0;
      function tick(ms) {
        if (!t0) t0 = ms;
        const cur = queue[state.index];
        viz.frame({
          playing: state.playing,
          positionSecs: state.posFrac * (cur?.durationSecs ?? 0),
          durationSecs: cur?.durationSecs ?? null,
          queue,
          currentIndex: state.index,
          queueRevision: queue.length,
          timeMs: ms,
          rate: state.rate,
        });
        const arm = root.querySelector(".arm");
        if (arm) q("armr").textContent = arm.style.getPropertyValue("--deg");
        if (window.__overlay) drawOverlay();
        driveSounds(ms);
        raf = requestAnimationFrame(tick);
      }

      // Debug overlay: band boundaries, the radius the geometry says the stylus
      // should be on, and a marker at the arm element's actual far end.
      function drawOverlay() {
        const platter = root.querySelector(".platter");
        let cv = root.querySelector(".__ovl");
        if (!cv) {
          cv = document.createElement("canvas");
          cv.className = "__ovl";
          cv.style.cssText = "position:absolute;inset:0;z-index:60;pointer-events:none";
          platter.append(cv);
          const dot = document.createElement("div");
          dot.className = "__tip";
          dot.style.cssText =
            "position:absolute;right:-4px;top:-4px;width:8px;height:8px;border-radius:50%;" +
            "background:#f0f;box-shadow:0 0 0 1px #fff;z-index:99;pointer-events:none";
          root.querySelector(".armlift").append(dot);
        }
        const w = platter.clientWidth;
        if (cv.width !== w) { cv.width = w; cv.height = w; cv.style.width = w + "px"; cv.style.height = w + "px"; }
        const geo = buildGeometry(w);
        const sides = splitSides(queue.map((t) => t.durationSecs));
        const side = sideAt(sides, state.index);
        const onSide = queue.slice(side.start, side.start + side.count);
        const bands = layoutBands(onSide.map((t) => t.durationSecs), geo);
        const rel = Math.max(0, Math.min(bands.length - 1, state.index - side.start));
        const want = positionToRadius(bands, rel, state.posFrac * (onSide[rel]?.durationSecs ?? 0), geo);
        const c = cv.getContext("2d");
        c.clearRect(0, 0, w, w);
        c.lineWidth = 1;
        bands.forEach((b, i) => {
          c.strokeStyle = i === rel ? "rgba(0,255,120,.9)" : "rgba(0,180,255,.45)";
          for (const r of [b.outer, b.inner]) {
            c.beginPath(); c.arc(geo.cx, geo.cy, r, 0, Math.PI * 2); c.stroke();
          }
        });
        c.strokeStyle = "#ff0"; c.lineWidth = 2;
        c.beginPath(); c.arc(geo.cx, geo.cy, want, 0, Math.PI * 2); c.stroke();
      }

      // ---- SOUND AUDITIONING ------------------------------------------------
      //
      // Deliberately wired from OUTSIDE the deck, by watching the state classes
      // it already writes (`lifted`, `motor-off`, `dragging`) and by
      // differentiating the platter's actual rotation. Nothing in src/visualizer.ts
      // knows this exists yet.
      //
      // That is the point of doing it here first. The sounds are the part with
      // taste in it and they need dozens of listens to get right; the wiring is
      // mechanical. Auditioning against the real mechanisms — rather than against
      // buttons that fake them — is what makes a spin-down sound like THIS deck's
      // brake, and it costs no risk to the shipped visualizer while the numbers
      // are still moving.
      // The DECK owns its own sound wiring now — it reads `host.audio` at mount
      // and fires from its own mechanisms. So the harness supplies the output
      // and gets out of the way; the copy that used to drive transitions from
      // out here is gone, because both firing would double every noise.
      //
      // `preview` is a second engine for the audition buttons only, so a single
      // sound can be heard on demand without having to produce the gesture that
      // causes it. It registers like a deck does, so the checkboxes govern both.
      let audio = null;
      let preview = createDeckSounds(null);
      const settings = { ...DEFAULT_SOUND_SETTINGS, voices: { ...DEFAULT_SOUND_SETTINGS.voices } };
      setDeckSoundSettings(settings);

      function enableAudio(on) {
        q("sndstate").textContent = on ? "on" : "off";
        // Constructed on the click, not on load: browsers refuse to start an
        // AudioContext without a gesture, and one built too early lands
        // suspended and silently plays nothing. The deck reads host.audio at
        // mount, so it has to be remounted once the device exists.
        if (on && !audio) {
          audio = new AudioContext();
          preview.destroy();
          preview = createDeckSounds(deckAudio(), settings);
          registerDeckSounds(preview);
          log("audio context created — deck remounted");
          mount();
        }
        audio?.resume?.();
        setDeckSoundSettings({ enabled: on });
      }

      /** What the host contract hands a visualizer. In the app the destination is
       *  a gain node tracking app volume; here there is no volume to track. */
      function deckAudio() {
        return audio ? { context: audio, destination: audio.destination } : undefined;
      }

      q("snd").onchange = () => enableAudio(q("snd").checked);
      q("lvl").oninput = () => {
        settings.level = Number(q("lvl").value);
        q("lvlv").textContent = `${(settings.level * 100).toFixed(0)}%`;
        setDeckSoundSettings({ level: settings.level });
      };
      // One checkbox per voice, built from the VOICES table so the harness can
      // never drift out of step with what the module actually supports — a new
      // noise appears here the moment it is declared.
      for (const v of VOICES) {
        const row = document.createElement("label");
        row.className = "row";
        row.style.cssText = "width:auto;gap:6px;opacity:1;cursor:pointer";
        row.title = v.hint;
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = settings.voices[v.id] !== false;
        cb.onchange = () => {
          settings.voices = { ...settings.voices, [v.id]: cb.checked };
          setDeckSoundSettings({ voices: { [v.id]: cb.checked } });
        };
        const txt = document.createElement("span");
        txt.textContent = v.label;
        row.append(cb, txt);
        q("voices").append(row);
      }
      for (const b of document.querySelectorAll("[data-snd]")) {
        b.onclick = () => {
          const k = b.dataset.snd;
          if (k === "drop") preview.drop();
          else if (k === "lift") preview.lift();
          else preview.click(k);
        };
      }

      // Platter velocity, MEASURED rather than re-simulated. The deck eases its
      // own spinVel and writes the result as a rotation; differentiating that is
      // the only reading that cannot drift from what is on screen. (A copy of the
      // easing here would be a second source of truth for the one number the
      // spin-down sound is entirely made of.)
      let lastAngle = null;
      let lastAngleMs = 0;
      let velSmooth = 1;

      function readAngle() {
        const el = root.querySelector(".spin");
        const m = /rotate\(([-0-9.]+)deg\)/.exec(el?.style.transform || "");
        return m ? Number(m[1]) : null;
      }

      // READOUT ONLY. The deck fires its own sounds from its own mechanisms; this
      // just reports the two numbers they are made of, so a spin-down that sounds
      // wrong can be checked against the velocity it was actually given.
      function driveSounds(ms) {
        const deck = root.querySelector(".deck");
        if (!deck) return;

        const a = readAngle();
        if (a !== null && lastAngle !== null) {
          const dt = ms - lastAngleMs;
          if (dt > 0) {
            // Shortest signed arc: the angle is taken mod 360 and would otherwise
            // report a full backwards turn every wrap.
            const d = ((a - lastAngle + 540) % 360) - 180;
            const inst = (d * 5) / dt; // deck: dAngle = dt * 0.2 * vel
            velSmooth += (inst - velSmooth) * 0.25;
          }
        }
        if (a !== null) { lastAngle = a; lastAngleMs = ms; }
        const vel = Math.max(0, velSmooth < 0.01 ? 0 : velSmooth);

        q("velv").textContent = vel.toFixed(2);
        q("needlev").textContent = deck.classList.contains("lifted") ? "up" : "down";
      }

      q("skin").onchange = () => { mount(); };
      q("n").oninput = () => {
        // 0 is a real state, not a guard to clamp away: an empty queue is what
        // the deck looks like with no record on it, and it needs looking at.
        state.n = Math.max(0, Number(q("n").value) || 0);
        queue = tracks(state.n);
        q("idx").max = String(state.n - 1);
        if (state.index > state.n - 1) state.index = state.n - 1;
      };
      q("idx").oninput = () => { state.index = Number(q("idx").value); q("idxv").textContent = state.index; };
      q("pos").oninput = () => {
        state.posFrac = Number(q("pos").value);
        q("posv").textContent = `${(state.posFrac * 100).toFixed(0)}%`;
      };
      q("playing").onchange = () => { state.playing = q("playing").checked; };
      q("remount").onclick = () => mount();
      q("stop").onclick = () => root.querySelector(".start")?.click();

      mount();
      raf = requestAnimationFrame(tick);

      // Handy for automated checks: where the drawn stylus actually sits, in
      // record-radius units, against where the geometry says it should.
      window.__probe = () => {
        const platter = root.querySelector(".platter").getBoundingClientRect();
        const cx = platter.left + platter.width / 2;
        const cy = platter.top + platter.height / 2;
        const rEdge = platter.width / 2;
        const pick = (sel, pseudo) => {
          const el = root.querySelector(sel);
          if (!el) return null;
          const r = el.getBoundingClientRect();
          return {
            cx: (r.left + r.width / 2 - cx) / rEdge,
            cy: (r.top + r.height / 2 - cy) / rEdge,
            radius: Math.hypot(r.left + r.width / 2 - cx, r.top + r.height / 2 - cy) / rEdge,
            w: r.width / rEdge,
            h: r.height / rEdge,
          };
        };
        return { head: pick(".head"), arm: root.querySelector(".arm").style.getPropertyValue("--deg") };
      };
    </script>
  </body>
</html>
